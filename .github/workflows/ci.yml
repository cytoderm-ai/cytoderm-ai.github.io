# 以下以一个构建vue项目的yml文件为例子
name: CI

# 给予工作流写权限，因为需要向gh-pages分支提交代码
permissions:
  contents: write

on:
    push:
        branches:
            - main # 这里只配置了main分支，所以只有推送main分支才会触发以下任务
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: npm
            - run: node -v
            - run: npm ci
            - run: npm run build
            - name: Deploy # 部署
              uses: JamesIves/github-pages-deploy-action@v4.6.1
              with:
                  branch: gh-pages # 部署后提交到哪个分支
                  folder: .cache/dist # 这里填写 Vite 打包产物目录
